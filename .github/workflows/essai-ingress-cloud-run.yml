name: Cloud Run · rouvrir l'accès entrant

# ESSAI DÉCIDÉ PAR MANASSE LE 2026-10-29 (« Oui pour l'essai cloud run »),
# JOUÉ ET RATÉ LE MÊME JOUR (run n° 1, 14:10 UTC).
#
# Fermé au seul trafic interne et des équilibreurs de charge
# (`--ingress internal-and-cloud-load-balancing`), le service ne répondait
# plus au relais du site (`oomega.web.app/api/**`, firebase.json) · le relais
# de Firebase Hosting appelle l'adresse `*.run.app` comme n'importe quel
# client, il ne passe par aucun équilibreur. Le site a perdu son serveur pour
# tous les cabinets de 14:10 à 14:23 UTC, jusqu'au geste « rouvrir ».
#
# LA FERMETURE EST RETIRÉE DE CE WORKFLOW · fermer l'adresse directe sans
# couper le site suppose un équilibreur de charge Google devant le service
# (ligne du suivi, docs/suivi-reprises.md), qui n'existe pas. Seul reste le
# geste de secours, « rouvrir », qui remet l'accès à `all` et relit le relais.
on:
  workflow_dispatch:
    inputs:
      geste:
        description: 'rouvrir (accès entrant remis à all, relais relu)'
        required: true
        default: rouvrir
        type: choice
        options:
          - rouvrir

permissions:
  contents: read

concurrency:
  group: acces-entrant-cloud-run
  cancel-in-progress: false

env:
  PROJECT_ID: omega-x-ec07a
  REGION: us-east1
  SERVICE: comptaflow-api
  URL_RELAIS: https://oomega.web.app/api/health

jobs:
  acces:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Accès entrant avant le geste
        run: |
          gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" \
            --format='value(metadata.annotations["run.googleapis.com/ingress"])'

      - name: Rouvrir
        if: inputs.geste == 'rouvrir'
        run: |
          gcloud run services update "$SERVICE" --region "$REGION" --project "$PROJECT_ID" \
            --ingress all --quiet

      - name: Le relais répond après le geste
        if: always()
        run: |
          sleep 20
          for i in 1 2 3 4 5 6; do
            if curl -sf --max-time 20 "$URL_RELAIS" > /dev/null; then echo "relais sain"; exit 0; fi
            sleep 10
          done
          echo "::error::Le relais ne répond pas après le geste · lancer ce workflow avec « rouvrir »."
          exit 1

      - name: Accès entrant après le geste
        if: always()
        run: |
          gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" \
            --format='value(metadata.annotations["run.googleapis.com/ingress"])'
