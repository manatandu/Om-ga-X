<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` : la page se peint jusque sous l'encoche et la barre
      d'accueil, et le cadre de l'application se rembourre de `env(safe-area-inset-*)`
      (index.css, `.cadre-sur`) · sans la balise, ces insets valent zéro.
      `interactive-widget=resizes-content` : le clavier d'un téléphone réduit la
      zone de mise en page (Android Chrome), comme sur iOS · `100dvh` suit.
      JAMAIS `user-scalable=no` ni `maximum-scale` : ce sont des échecs
      d'accessibilité, et le zoom d'un champ se corrige par sa taille (16 px).
      Un seul `theme-color` : l'interface n'a pas de thème sombre.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>OmegaX</title>
    <meta
      name="description"
      content="Tenue comptable, états financiers et liasses OHADA pour les ASBL, ONG et entreprises de RDC."
    />
    <!--
      Les quatre lignes qui rendent l'application INSTALLABLE. Sans manifeste
      lié ici, aucun navigateur ne propose l'installation, quelle que soit la
      qualité du reste · c'est le prérequis commun à tous les magasins.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icone.svg" />
    <link rel="apple-touch-icon" href="/icone-192.png" />
    <meta name="theme-color" content="#2a1f5c" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
